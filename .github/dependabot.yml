# Dependabot opens weekly update PRs. It has no auto-merge setting of its own:
# .github/workflows/dependabot-weekly-merge.yml merges the non-major PRs whose
# required test jobs and all other checks pass every Monday. Major version bumps
# are left for manual review.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
