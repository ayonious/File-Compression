# Dependabot opens weekly update PRs: one grouped PR per ecosystem for all
# minor/patch bumps, and a separate PR for each major bump. It has no auto-merge
# setting of its own: .github/workflows/dependabot-weekly-merge.yml merges the
# non-major PRs whose required test jobs and all other checks pass every Monday.
# Major version bumps are left for manual review.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types: [minor, patch]
